services:
  # Laravel Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sqhm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:SQHMDevelopmentKey1234567890abcdef=
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./backend/database:/var/www/html/database
      - ./backend/storage:/var/www/html/storage
    networks:
      - sqhm_net

  # Vue 3 Frontend Web Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sqhm_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sqhm_net

networks:
  sqhm_net:
    driver: bridge
